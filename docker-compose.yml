services:
  # BE : Go (Gin)
  backend:
    build: ./BE
    container_name: backend
    ports:
      - "8080:8080"
    volumes:
      - ./BE:/app
    environment:
      DB_HOST: postgres
      DB_USER: kura_user
      DB_PASSWORD: kura_password
      DB_NAME: kura_db
    depends_on:
      - db
    tty: true


  # FE : Nuxt.js
  frontend:
    build: ./FE
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./FE:/app
      - /app/node_modules
    tty: true

  # DB : PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=kura_user
      - POSTGRES_PASSWORD=kura_password
      - POSTGRES_DB=kura_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: