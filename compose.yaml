services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kura_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - web_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      
  
  nginx:
    image: nginx:alpine
    container_name: kura_nginx
    restart: always
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - web_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
    -  ALL
    cap_add:
    - CAP_CHOWN
    - CAP_SETUID
    - CAP_SETGID
    - CAP_NET_BIND_SERVICE

  backend:
    build: ./backend
    container_name: kura_backend
    restart: always
    working_dir: /app

    volumes:
      # アップロードされたファイルの保存先
      - ./backend/uploads:/app/uploads

      - ./.env:/app/.env

    # DB接続情報
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TZ=Asia/Tokyo
    env_file:
      - ./backend/.env

    networks:
      - web_net
      - db_net

    depends_on:
      - db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend/kura
      dockerfile: Dockerfile
    container_name: kura_frontend
    restart: always
    environment:
      - API_BASE_URL=http://nginx:80/api
      - TZ=Asia/Tokyo

      - HOST=0.0.0.0
      - PORT=3000

    networks:
      - web_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:15-alpine
    container_name: kura_db
    restart: always

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Asia/Tokyo

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/:/docker-entrypoint-initdb.d/

    networks:
      - db_net

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CAP_CHOWN
      - CAP_SETUID
      - CAP_SETGID
      - CAP_DAC_OVERRIDE

volumes:
  postgres_data:

networks:
  web_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true